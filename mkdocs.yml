site_name: BA Notes Library
site_description: Searchable knowledge base for the BA-Notes repository (Agile, BA interview prep, resume, project simulation)
repo_url: https://github.com/tsrajpurohit/BA-Notes
repo_name: tsrajpurohit/BA-Notes

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Masterclass Overview:
    - "MASTERCLASS": masterclass-overview/masterclass/index.md
  - Agile Masterclass:
